<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 聊天</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            position: relative;
            transition: margin-left 0.3s ease;
        }
        .main-wrapper.sidebar-open {
            margin-left: 280px;
        }
        .chat-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .header h1 {
            color: #667eea;
            margin: 0;
            font-size: 28px;
        }
        .header p {
            color: #666;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .messages {
            height: 450px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: 20%;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #f0f0f0;
            color: #333;
            margin-right: 20%;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
        .option-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }
        input[type="checkbox"] {
            cursor: pointer;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
            padding: 10px;
        }
        .streaming-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: #667eea;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .system-prompt-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            resize: vertical;
        }
        .system-prompt-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .toggle-system-prompt {
            margin-bottom: 10px;
        }
        /* 历史查看弹窗样式 */
        .history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .history-modal.active {
            display: flex;
        }
        .history-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .history-header h2 {
            margin: 0;
            color: #667eea;
            font-size: 24px;
        }
        .close-btn {
            background: transparent;
            color: #999;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
        }
        .close-btn::before,
        .close-btn::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 2px;
            background-color: currentColor;
            transition: all 0.3s ease;
        }
        .close-btn::before {
            transform: rotate(45deg);
        }
        .close-btn::after {
            transform: rotate(-45deg);
        }
        .close-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
            transform: rotate(90deg);
        }
        .sidebar-close-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .sidebar-close-btn::before,
        .sidebar-close-btn::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 2px;
            background-color: white;
            transition: all 0.3s ease;
        }
        .sidebar-close-btn::before {
            transform: rotate(45deg);
        }
        .sidebar-close-btn::after {
            transform: rotate(-45deg);
        }
        .sidebar-close-btn:hover {
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }
        .history-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .history-item.user {
            background-color: #e3f2fd;
            border-left-color: #2196f3;
        }
        .history-item.assistant {
            background-color: #f1f8e9;
            border-left-color: #4caf50;
        }
        .history-role {
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }
        .history-text {
            color: #333;
            line-height: 1.6;
        }
        /* 会话侧边栏样式 */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 998;
        }
        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2);
            transition: left 0.3s ease;
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar.active {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .sidebar-header h3 {
            margin: 0;
            color: #667eea;
        }
        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
        }
        .session-item:hover {
            background-color: #f5f5f5;
            border-color: #667eea;
        }
        .session-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .session-title {
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-id {
            font-size: 10px;
            opacity: 0.7;
        }
        .toggle-sidebar-btn {
            position: fixed;
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1001;
            padding: 15px 20px 15px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0 12px 12px 0;
            box-shadow: 3px 0 15px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            border: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            will-change: transform, left;
        }
        .toggle-sidebar-btn::before {
            content: '📋';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .toggle-sidebar-btn:hover {
            left: 0;
            transform: translateY(-50%) translateX(0);
            box-shadow: 5px 0 25px rgba(102, 126, 234, 0.6);
        }
        .toggle-sidebar-btn:hover::before {
            transform: translateY(-50%) scale(1.2) translateX(5px);
        }
        /* 侧边栏打开时隐藏切换按钮 */
        .sidebar.active ~ .toggle-sidebar-btn {
            left: 300px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 遮罩层 -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 会话侧边栏 -->
    <div id="sessionSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>💬 历史会话</h3>
            <button class="sidebar-close-btn" onclick="toggleSidebar()"></button>
        </div>
        <div id="sessionList"></div>
    </div>

    <!-- 切换按钮 -->
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">会话列表</button>

    <div class="main-wrapper">
        <div class="chat-container">
        <div class="header">
            <h1>🤖 Spring AI 聊天助手</h1>
            <p>基于 Spring AI 框架的智能对话系统（支持多轮对话）</p>
            <p style="font-size: 12px; color: #999; margin-top: 5px;">会话ID: <span id="sessionId">加载中...</span></p>
        </div>
        
        <div class="messages" id="messages"></div>
        
        <div class="toggle-system-prompt">
            <label>
                <input type="checkbox" id="showSystemPrompt" onchange="toggleSystemPrompt()"> 
                显示系统提示设置
            </label>
        </div>
        
        <div id="systemPromptContainer" style="display: none;">
            <textarea 
                id="systemPromptInput" 
                class="system-prompt-input" 
                rows="2"
                placeholder="输入系统提示（可选），例如：你是一个专业的编程助手">你是一个有用的AI助手</textarea>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." />
            <button onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
        
        <div class="options">
            <div class="option-group">
                <label>
                    <input type="checkbox" id="streamMode" checked> 
                    启用流式响应
                </label>
                <label>
                    <input type="checkbox" id="enableMemory" checked> 
                    启用多轮对话记忆
                </label>
            </div>
            <div class="option-group">
                <button onclick="clearMessages()" style="padding: 8px 16px; font-size: 12px;">清空对话</button>
                <button onclick="viewHistory()" style="padding: 8px 16px; font-size: 12px; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">查看历史</button>
                <button onclick="clearSessionMemory()" style="padding: 8px 16px; font-size: 12px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">清除记忆</button>
                <button onclick="newSession()" style="padding: 8px 16px; font-size: 12px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">新会话</button>
            </div>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 历史查看弹窗 -->
    <div id="historyModal" class="history-modal">
        <div class="history-content">
            <div class="history-header">
                <h2>📜 对话历史</h2>
                <button class="close-btn" onclick="closeHistory()">✕</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // API 基础路径
        const API_BASE = '/api/spring-ai';
        
        // 生成或获取会话ID
        let currentSessionId = localStorage.getItem('chat_session_id');
        if (!currentSessionId) {
            currentSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', currentSessionId);
        }
        
        // 显示会话ID
        function updateSessionIdDisplay() {
            const sessionIdElement = document.getElementById('sessionId');
            if (sessionIdElement) {
                sessionIdElement.textContent = currentSessionId;
            }
        }
        
        function toggleSystemPrompt() {
            const container = document.getElementById('systemPromptContainer');
            const checkbox = document.getElementById('showSystemPrompt');
            container.style.display = checkbox.checked ? 'block' : 'none';
        }
        
        function addMessage(text, isUser) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }
        
        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }
        
        // 清除会话记忆
        async function clearSessionMemory() {
            try {
                const response = await fetch(`${API_BASE}/clear-memory`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sessionId: currentSessionId })
                });
                
                const data = await response.json();
                if (data.success) {
                    addMessage('✅ 会话记忆已清除，可以开始新的对话', false);
                }
            } catch (error) {
                console.error('清除记忆失败:', error);
                addMessage('❌ 清除记忆失败: ' + error.message, false);
            }
        }
        
        // 创建新会话
        function newSession() {
            // 生成新的会话ID
            currentSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', currentSessionId);
            updateSessionIdDisplay();
            
            // 清空对话
            clearMessages();
            
            // 显示欢迎消息
            addMessage('✨ 已创建新会话，让我们开始新的对话吧！', false);
        }

        // 查看对话历史
        async function viewHistory() {
            try {
                const response = await fetch(`${API_BASE}/get-history`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sessionId: currentSessionId })
                });
                
                const data = await response.json();
                const historyList = document.getElementById('historyList');
                
                if (data.history && data.history.length > 0) {
                    let html = `<p style="color: #666; margin-bottom: 15px;">共 ${data.count} 条消息</p>`;
                    
                    data.history.forEach((msg, index) => {
                        const roleClass = msg.role === 'user' ? 'user' : 'assistant';
                        const roleText = msg.role === 'user' ? '👤 用户' : '🤖 AI助手';
                        
                        html += `
                            <div class="history-item ${roleClass}">
                                <div class="history-role">${roleText}</div>
                                <div class="history-text">${escapeHtml(msg.content)}</div>
                            </div>
                        `;
                    });
                    
                    historyList.innerHTML = html;
                } else {
                    historyList.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">暂无对话历史</p>';
                }
                
                // 显示弹窗
                document.getElementById('historyModal').classList.add('active');
            } catch (error) {
                console.error('获取历史失败:', error);
                alert('获取对话历史失败: ' + error.message);
            }
        }

        // 关闭历史弹窗
        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }

        // HTML转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 点击弹窗外部关闭
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeHistory();
            }
        });

        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sessionSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const mainWrapper = document.querySelector('.main-wrapper');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (sidebar.classList.contains('active')) {
                mainWrapper.style.marginLeft = '300px';
                loadSessionList();
            } else {
                mainWrapper.style.marginLeft = '0';
            }
        }

        // 加载会话列表
        async function loadSessionList() {
            try {
                const response = await fetch(`${API_BASE}/sessions`);
                const data = await response.json();
                const sessionList = document.getElementById('sessionList');
                
                if (data.sessions && data.sessions.length > 0) {
                    let html = '';
                    data.sessions.forEach(session => {
                        const isActive = session.id === currentSessionId ? 'active' : '';
                        html += `
                            <div class="session-item ${isActive}" onclick="switchSession('${session.id}')">
                                <div class="session-title">${escapeHtml(session.title)}</div>
                                <div class="session-id">ID: ${session.id.substring(session.id.length - 8)}</div>
                            </div>
                        `;
                    });
                    sessionList.innerHTML = html;
                } else {
                    sessionList.innerHTML = '<p style="text-align: center; color: #999;">暂无其他会话</p>';
                }
            } catch (error) {
                console.error('加载会话列表失败:', error);
            }
        }

        // 切换会话
        function switchSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('chat_session_id', currentSessionId);
            updateSessionIdDisplay();
            clearMessages();
            toggleSidebar(); // 关闭侧边栏
            addMessage(`✨ 已切换到会话: ${sessionId.substring(sessionId.length - 8)}`, false);
            
            // 重新加载会话列表以更新高亮状态
            setTimeout(() => loadSessionList(), 300);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const streamMode = document.getElementById('streamMode').checked;
            const useSystemPrompt = document.getElementById('showSystemPrompt').checked;
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, true);
            input.value = '';
            
            // 禁用发送按钮
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';
            
            // 显示加载状态
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = 'AI正在思考...';
            loadingDiv.id = 'loading';
            messagesDiv.appendChild(loadingDiv);
            
            try {
                if (streamMode) {
                    // 使用流式响应
                    await sendStreamMessage(message, useSystemPrompt);
                } else {
                    // 使用普通响应
                    await sendNormalMessage(message, useSystemPrompt);
                }
            } catch (error) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) loadingElement.remove();
                addMessage('请求失败: ' + error.message, false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }
        
        async function sendNormalMessage(message, useSystemPrompt) {
            let url, body;
            const enableMemory = document.getElementById('enableMemory').checked;
            
            if (useSystemPrompt) {
                const systemPrompt = document.getElementById('systemPromptInput').value || '你是一个有用的AI助手';
                if (enableMemory) {
                    url = `${API_BASE}/chat-with-memory-and-system`;
                    body = JSON.stringify({ 
                        sessionId: currentSessionId,
                        systemMessage: systemPrompt,
                        userMessage: message 
                    });
                } else {
                    url = `${API_BASE}/chat-with-system`;
                    body = JSON.stringify({ 
                        systemMessage: systemPrompt,
                        userMessage: message 
                    });
                }
            } else {
                if (enableMemory) {
                    url = `${API_BASE}/chat-with-memory`;
                    body = JSON.stringify({ 
                        sessionId: currentSessionId,
                        message: message 
                    });
                } else {
                    url = `${API_BASE}/chat`;
                    body = JSON.stringify({ message: message });
                }
            }
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: body
            });
            
            const data = await response.json();
            
            // 移除加载提示
            const loadingElement = document.getElementById('loading');
            if (loadingElement) loadingElement.remove();
            
            if (data.response) {
                addMessage(data.response, false);
            } else if (data.error) {
                addMessage('错误: ' + data.error, false);
            }
        }
        
        async function sendStreamMessage(message, useSystemPrompt) {
            // 创建空的AI消息容器
            const aiMessageDiv = addMessage('', false);
            aiMessageDiv.classList.add('streaming-cursor');
            
            // 移除加载提示
            const loadingElement = document.getElementById('loading');
            if (loadingElement) loadingElement.remove();
            
            const enableMemory = document.getElementById('enableMemory').checked;
            let url, body;
            
            if (useSystemPrompt) {
                const systemPrompt = document.getElementById('systemPromptInput').value || '你是一个有用的AI助手';
                if (enableMemory) {
                    url = `${API_BASE}/chat-stream-with-memory-and-system`;
                    body = JSON.stringify({ 
                        sessionId: currentSessionId,
                        systemMessage: systemPrompt,
                        userMessage: message 
                    });
                } else {
                    url = `${API_BASE}/chat-stream-with-system`;
                    body = JSON.stringify({ 
                        systemMessage: systemPrompt,
                        userMessage: message 
                    });
                }
            } else {
                if (enableMemory) {
                    url = `${API_BASE}/chat-stream-with-memory`;
                    body = JSON.stringify({ 
                        sessionId: currentSessionId,
                        message: message 
                    });
                } else {
                    url = `${API_BASE}/chat-stream`;
                    body = JSON.stringify({ message: message });
                }
            }
            
            // 使用 fetch + ReadableStream 处理流式响应
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: body
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let accumulatedText = '';
            let buffer = ''; // 添加缓冲区处理不完整的数据行
            
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk; // 将新数据添加到缓冲区
                    
                    // 按行分割缓冲区
                    const lines = buffer.split('\n');
                    // 保留最后一个不完整的行在缓冲区中
                    buffer = lines.pop() || '';
                    
                    // 处理完整的行
                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data:')) {
                            // 支持 "data:" 和 "data: " 两种格式
                            const data = trimmedLine.startsWith('data: ') 
                                ? trimmedLine.slice(6) 
                                : trimmedLine.slice(5);
                            if (data && data !== '[DONE]') {
                                accumulatedText += data;
                                aiMessageDiv.textContent = accumulatedText;
                                // 滚动到底部
                                const messagesDiv = document.getElementById('messages');
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        }
                    }
                }
                
                // 处理缓冲区中剩余的数据
                if (buffer.trim()) {
                    const trimmedLine = buffer.trim();
                    if (trimmedLine.startsWith('data: ')) {
                        const data = trimmedLine.slice(6);
                        if (data && data !== '[DONE]') {
                            accumulatedText += data;
                            aiMessageDiv.textContent = accumulatedText;
                        }
                    }
                }
            } finally {
                reader.releaseLock();
                aiMessageDiv.classList.remove('streaming-cursor');
            }
        }

        // 按回车键发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 页面加载时显示欢迎消息
        window.onload = function() {
            updateSessionIdDisplay();
            addMessage('你好！我是基于 Spring AI 的聊天助手。有什么可以帮助你的吗？', false);
            addMessage('💡 提示：已启用多轮对话记忆功能，我可以记住我们的对话历史哦！', false);
        };
    </script>
